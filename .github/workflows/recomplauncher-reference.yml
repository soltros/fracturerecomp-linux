name: RecompLauncher SDK references
on:
  workflow_dispatch:
  push:
    branches: [appimage-builder]
    paths: ['.github/workflows/recomplauncher-reference.yml']
permissions:
  contents: read
jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read the current integration guide and catalog
        run: |
          mkdir references
          python3 - <<'PY'
          import json, pathlib, urllib.request
          root = pathlib.Path('references')
          files = {f'guide-part-{i}.md': f'https://recomplauncher.com/sdk-files/guide-part-{i}.md' for i in (1, 2, 3)}
          files['pc-catalog-web.json'] = 'https://recomplauncher.com/pc-catalog-web.json'
          for name, url in files.items():
              try:
                  req = urllib.request.Request(url, headers={'User-Agent': 'FractureRecomp-SDK-integration'})
                  with urllib.request.urlopen(req, timeout=45) as response:
                      content = response.read()
                  (root / name).write_bytes(content)
                  print(f'{name}: {len(content)} bytes')
              except Exception as error:
                  print(f'{name}: unavailable ({error}); use the linked SDK repository fallback')
          catalog = root / 'pc-catalog-web.json'
          if catalog.exists():
              def visit(value):
                  if isinstance(value, dict):
                      if str(value.get('repo', '')).lower() == 'soltros/fracturerecomp-linux':
                          print('Catalog match:', json.dumps(value))
                      for item in value.values():
                          visit(item)
                  elif isinstance(value, list):
                      for item in value:
                          visit(item)
              visit(json.loads(catalog.read_text()))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RecompLauncher-references
          path: references/*
          if-no-files-found: warn
